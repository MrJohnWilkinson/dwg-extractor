[project]
name = "dwg-block-extractor"
version = "0.1.0"
description = "Extract block information from DWG/DXF files and generate Excel reports"
requires-python = ">=3.8"
dependencies = [
    "ezdxf>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
