[project]
name = "dwg-block-extractor"
version = "0.1.0"
description = "Extract block information from DWG/DXF files and generate Excel reports"
requires-python = ">=3.8"
dependencies = [
    "ezdxf>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "types-openpyxl>=3.1.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
# Configure pytest to run from app/ directory to support relative test paths
testpaths = ["app/tests"]
pythonpath = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ['.venv', 'build', 'dist']

[[tool.mypy.overrides]]
module = ["ezdxf", "ezdxf.*", "customtkinter", "customtkinter.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app/core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
