[project]
name = "dwg-block-extractor"
version = "0.1.0"
description = "Extract block information from DWG/DXF files and generate Excel reports"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "types-openpyxl>=3.1.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.0.0",
]
dev = [
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
# Configure pytest to run from app/ directory to support relative test paths
testpaths = ["app/tests"]
pythonpath = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ['.venv', 'build', 'dist']

[[tool.mypy.overrides]]
module = ["ezdxf", "ezdxf.*", "customtkinter", "customtkinter.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "build", "dist", ".history"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # Line length handled by formatter, too restrictive for docstrings

[tool.ruff.lint.isort]
known-first-party = ["app", "core"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["app/core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
